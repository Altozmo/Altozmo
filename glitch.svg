<svg width="800" height="140" viewBox="0 0 800 140" xmlns="http://w3.org">
  <rect width="800" height="140" fill="#07080f" rx="10" />

  <!-- Cyan Neon Offset -->
  <text x="396" y="74" font-family="monospace" font-weight="bold" font-size="46" letter-spacing="5" fill="#00f7ff" text-anchor="middle">
    SYSTEM_ONLINE
    <animate attributeName="x" values="396;404;395;402;396" dur="0.4s" repeatCount="indefinite" />
    <animate attributeName="y" values="74;70;75;71;74" dur="0.5s" repeatCount="indefinite" />
  </text>

  <!-- Magenta Neon Offset -->
  <text x="404" y="70" font-family="monospace" font-weight="bold" font-size="46" letter-spacing="5" fill="#ff0055" text-anchor="middle">
    SYSTEM_ONLINE
    <animate attributeName="x" values="404;396;405;398;404" dur="0.45s" repeatCount="indefinite" />
    <animate attributeName="y" values="70;74;69;73;70" dur="0.35s" repeatCount="indefinite" />
  </text>

  <!-- Crisp White Core Text -->
  <text x="400" y="72" font-family="monospace" font-weight="bold" font-size="46" letter-spacing="5" fill="#ffffff" text-anchor="middle">
    SYSTEM_ONLINE
  </text>

  <!-- Flickering Neon Subtitle -->
  <text x="400" y="112" font-family="monospace" font-size="14" letter-spacing="3" fill="#00f7ff" text-anchor="middle">
    [ NEURAL LINK ESTABLISHED // ACCESS GRANTED ]
    <animate attributeName="opacity" values="1;0.1;1;0.3;1" dur="2s" repeatCount="indefinite" />
  </text>
</svg>

<svg width="800" height="140" viewBox="0 0 800 140" xmlns="http://w3.org">
  <rect width="800" height="140" fill="#07080f" rx="10" />

  <!-- Cyan Glitch Layer -->
  <text x="400" y="72" font-family="monospace" font-weight="900" font-size="46" letter-spacing="5" fill="#00f7ff" text-anchor="middle">
    SYSTEM_ONLINE
    <animateTransform attributeName="transform" type="translate" values="0,0; -4,2; 4,-2; -2,-1; 0,0" dur="1.5s" repeatCount="indefinite" />
  </text>

  <!-- Magenta Glitch Layer -->
  <text x="400" y="72" font-family="monospace" font-weight="900" font-size="46" letter-spacing="5" fill="#ff0055" text-anchor="middle">
    SYSTEM_ONLINE
    <animateTransform attributeName="transform" type="translate" values="0,0; 4,-2; -4,2; 2,1; 0,0" dur="1.5s" repeatCount="indefinite" />
  </text>

  <!-- Main White Text -->
  <text x="400" y="72" font-family="monospace" font-weight="900" font-size="46" letter-spacing="5" fill="#ffffff" text-anchor="middle">
    SYSTEM_ONLINE
  </text>

  <!-- Flickering Subtitle -->
  <text x="400" y="112" font-family="monospace" font-size="14" letter-spacing="3" fill="#00f7ff" text-anchor="middle">
    [ NEURAL LINK ESTABLISHED // ACCESS GRANTED ]
    <animate attributeName="opacity" values="1; 0.2; 1; 0.4; 1" dur="2.5s" repeatCount="indefinite" />
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
<title id="title">ALTOZMO — Glitch Knight cyberpunk developer dashboard</title>
<desc id="desc">A custom vector cyberpunk interface in midnight blue, electric cyan and violet, featuring an operator profile, neural network, technology modules and project panels.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#050916"/><stop offset=".55" stop-color="#08152b"/><stop offset="1" stop-color="#100b28"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#80f3ff"/><stop offset=".48" stop-color="#20bfff"/><stop offset="1" stop-color="#356cff"/>
  </linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7b5cff"/><stop offset="1" stop-color="#d36bff"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0d2340" stop-opacity=".96"/><stop offset="1" stop-color="#080f20" stop-opacity=".96"/>
  </linearGradient>
  <radialGradient id="core">
    <stop offset="0" stop-color="#b6faff" stop-opacity=".95"/>
    <stop offset=".25" stop-color="#28cfff" stop-opacity=".55"/>
    <stop offset="1" stop-color="#167aff" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M30 0H0V30" fill="none" stroke="#1c5b91" stroke-opacity=".22" stroke-width="1"/>
    <circle cx="0" cy="0" r="1.2" fill="#48dfff" fill-opacity=".3"/>
  </pattern>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="16"/>
  </filter>
  <style>
    .mono{font-family:Consolas,'Courier New',monospace}
    .white{fill:#eaf7ff}
    .muted{fill:#83a9c9}
    .cyan{fill:#55ddff}
    .violet{fill:#b28cff}
    .green{fill:#67f5c4}
    .tiny{font-size:10px;letter-spacing:2px}
    .small{font-size:13px}
    .label{font-size:12px;letter-spacing:2px}
    .heading{font-size:19px;font-weight:700;letter-spacing:2px}
    .panel{fill:url(#panel);stroke:#167fbd;stroke-opacity:.8;stroke-width:1.4}
    .line{stroke:#28bfff;stroke-opacity:.7;fill:none}
  </style>
</defs>

<!-- BACKGROUND -->
<rect width="1200" height="1000" fill="url(#bg)"/>
<rect width="1200" height="1000" fill="url(#grid)"/>
<circle cx="600" cy="425" r="280" fill="#087dff" opacity=".08" filter="url(#soft)"/>
<circle cx="1060" cy="160" r="180" fill="#8b4dff" opacity=".07" filter="url(#soft)"/>
<path d="M0 130H1200M0 870H1200" stroke="#236ba1" stroke-opacity=".35"/>
<path d="M20 20H1180V980H20Z" fill="none" stroke="#247db5" stroke-width="1.5" opacity=".8"/>
<path d="M20 80V20H80M1120 20H1180V80M20 920V980H80M1120 980H1180V920" fill="none" stroke="#55ddff" stroke-width="3" filter="url(#glow)"/>

<!-- TOP IDENTITY STRIP -->
<text x="55" y="53" class="mono tiny cyan">ALTOZMO // PERSONAL DEVELOPER INTERFACE</text>
<text x="1145" y="53" text-anchor="end" class="mono tiny muted">NODE 07 · PROFILE BUILD 03.0</text>
<path d="M55 70H1145" stroke="#278ac0" stroke-opacity=".65"/>
<text x="600" y="151" text-anchor="middle" class="mono" font-size="66" font-weight="bold" letter-spacing="12" fill="#f2fbff" filter="url(#glow)">ALTOZMO</text>
<text x="600" y="187" text-anchor="middle" class="mono" font-size="19" letter-spacing="8" fill="#55ddff">GLITCH KNIGHT // DEVELOPER</text>
<text x="600" y="217" text-anchor="middle" class="mono small muted" letter-spacing="3">BUILDING IDEAS AT THE EDGE OF TECHNOLOGY</text>
<rect x="470" y="239" width="260" height="27" rx="3" fill="#071b30" stroke="#1e9bcb"/>
<circle cx="489" cy="252.5" r="4" fill="#67f5c4" filter="url(#glow)"/>
<text x="600" y="257" text-anchor="middle" class="mono tiny white">SYSTEM ONLINE  /  ACCESS GRANTED</text>

<!-- LEFT OPERATOR PANEL -->
<path class="panel" d="M55 305H335L355 325V565H55Z"/>
<path d="M55 305H255" stroke="#55ddff" stroke-width="3" filter="url(#glow)"/>
<text x="77" y="340" class="mono tiny cyan">01 // OPERATOR DATA</text>
<text x="77" y="377" class="mono heading white">IDENTITY FILE</text>
<path d="M77 392H328" stroke="#2779a9" stroke-opacity=".7"/>
<g class="mono small">
  <text x="78" y="423" class="muted">HANDLE</text><text x="190" y="423" class="white">ALTOZMO</text>
  <text x="78" y="451" class="muted">ALIAS</text><text x="190" y="451" class="violet">GLITCH KNIGHT</text>
  <text x="78" y="479" class="muted">ROLE</text><text x="190" y="479" class="white">CREATOR</text>
  <text x="78" y="507" class="muted">FOCUS</text><text x="190" y="507" class="cyan">AI / CODE / GAMES</text>
</g>
<path d="M77 527H328" stroke="#2779a9" stroke-opacity=".45"/>
<text x="78" y="548" class="mono tiny green">STATUS: LEARNING // BUILDING</text>

<!-- RIGHT SYSTEM PANEL -->
<path class="panel" d="M845 305H1125V565H825V325Z"/>
<path d="M945 305H1125V365" fill="none" stroke="#a276ff" stroke-width="3" filter="url(#glow)"/>
<text x="865" y="340" class="mono tiny violet">02 // SYSTEM DIRECTIVE</text>
<text x="865" y="377" class="mono heading white">MISSION CONTROL</text>
<path d="M865 392H1102" stroke="#6c57bc" stroke-opacity=".7"/>
<text x="865" y="425" class="mono small muted">PRIMARY DIRECTIVE</text>
<text x="865" y="452" class="mono" font-size="16" fill="#eaf7ff">TURN IDEAS INTO REALITY.</text>
<text x="865" y="493" class="mono small muted">ACTIVE PROTOCOLS</text>
<g class="mono small">
  <circle cx="874" cy="519" r="3" fill="#55ddff"/><text x="888" y="523" class="white">LEARN / EXPERIMENT</text>
  <circle cx="874" cy="543" r="3" fill="#b28cff"/><text x="888" y="547" class="white">DESIGN / BUILD / IMPROVE</text>
</g>

<!-- CENTRAL NEURAL CORE -->
<text x="600" y="311" text-anchor="middle" class="mono tiny cyan">03 // NEURAL NETWORK CORE</text>
<circle cx="600" cy="445" r="118" fill="none" stroke="#1c83c7" stroke-dasharray="3 9" stroke-width="1.2"/>
<circle cx="600" cy="445" r="91" fill="none" stroke="#7c5cff" stroke-opacity=".7" stroke-dasharray="26 8 3 8"/>
<circle cx="600" cy="445" r="75" fill="url(#core)"/>
<g stroke="#30caff" stroke-opacity=".58" stroke-width="1.2" fill="none">
  <path d="M520 390L565 365L600 382L644 360L681 398L665 452L680 495L630 521L581 516L532 487L510 438Z"/>
  <path d="M520 390L600 445L681 398M565 365L581 516M644 360L532 487M510 438L665 452M520 390L630 521M565 365L665 452M644 360L510 438M532 487L681 398"/>
  <path d="M520 390L581 516L681 398M565 365L630 521L510 438"/>
</g>
<g fill="#07172b" stroke="#55ddff" stroke-width="2" filter="url(#glow)">
  <circle cx="520" cy="390" r="7"/><circle cx="565" cy="365" r="6"/><circle cx="600" cy="382" r="7"/>
  <circle cx="644" cy="360" r="6"/><circle cx="681" cy="398" r="7"/><circle cx="665" cy="452" r="6"/>
  <circle cx="680" cy="495" r="7"/><circle cx="630" cy="521" r="6"/><circle cx="581" cy="516" r="7"/>
  <circle cx="532" cy="487" r="6"/><circle cx="510" cy="438" r="7"/>
</g>
<circle cx="600" cy="445" r="36" fill="#0b2446" stroke="#8eeeff" stroke-width="2" filter="url(#glow)"/>
<circle cx="600" cy="445" r="25" fill="none" stroke="#8b6cff" stroke-width="1.5"/>
<path d="M588 455L600 421L612 455L600 448Z" fill="#55ddff" filter="url(#glow)"/>
<text x="600" y="579" text-anchor="middle" class="mono tiny muted">INPUT  //  PROCESS  //  OUTPUT</text>

<!-- LOWER TECHNOLOGY MODULES -->
<path class="panel" d="M55 625H390V820H55Z"/>
<path d="M55 625H260" stroke="#55ddff" stroke-width="3" filter="url(#glow)"/>
<text x="77" y="659" class="mono tiny cyan">04 // DEVELOPMENT LAYER</text>
<text x="77" y="691" class="mono heading white">TECH STACK</text>
<path d="M77 704H368" stroke="#2779a9" stroke-opacity=".6"/>
<g class="mono small">
  <text x="80" y="738" class="cyan">01</text><text x="120" y="738" class="white">PYTHON</text><text x="345" y="738" text-anchor="end" class="muted">CORE</text>
  <text x="80" y="766" class="cyan">02</text><text x="120" y="766" class="white">HTML / CSS</text><text x="345" y="766" text-anchor="end" class="muted">WEB</text>
  <text x="80" y="794" class="cyan">03</text><text x="120" y="794" class="white">JAVASCRIPT</text><text x="345" y="794" text-anchor="end" class="muted">LEARNING</text>
</g>

<path class="panel" d="M425 625H775V820H425Z"/>
<path d="M425 625H625" stroke="#a276ff" stroke-width="3" filter="url(#glow)"/>
<text x="447" y="659" class="mono tiny violet">05 // ACTIVE PROJECTS</text>
<text x="447" y="691" class="mono heading white">PROJECT ARCHIVE</text>
<path d="M447 704H753" stroke="#6c57bc" stroke-opacity=".65"/>
<text x="448" y="738" class="mono small cyan">[ 01 ] FRESHCHECK</text>
<text x="448" y="758" class="mono small muted">AI fruit freshness estimation</text>
<text x="448" y="787" class="mono small cyan">[ 02 ] GAME LAB</text>
<text x="448" y="807" class="mono small muted">Game development experiments</text>

<path class="panel" d="M810 625H1125V820H810Z"/>
<path d="M810 625H1010" stroke="#55ddff" stroke-width="3" filter="url(#glow)"/>
<text x="832" y="659" class="mono tiny cyan">06 // RESEARCH DIVISION</text>
<text x="832" y="691" class="mono heading white">AREAS OF INTEREST</text>
<path d="M832 704H1103" stroke="#2779a9" stroke-opacity=".6"/>
<g class="mono small">
  <text x="834" y="738" class="white">ARTIFICIAL INTELLIGENCE</text>
  <text x="834" y="766" class="white">SOFTWARE DEVELOPMENT</text>
  <text x="834" y="794" class="white">SCIENCE &amp; TECHNOLOGY</text>
</g>

<!-- FOOTER -->
<path d="M55 855H1145" stroke="#287bb1" stroke-opacity=".7"/>
<text x="55" y="886" class="mono tiny muted">ALTOZMO // GLITCH KNIGHT</text>
<text x="600" y="886" text-anchor="middle" class="mono tiny cyan">EXPLORE  ·  CREATE  ·  INNOVATE</text>
<text x="1145" y="886" text-anchor="end" class="mono tiny muted">END OF TRANSMISSION</text>
<text x="600" y="936" text-anchor="middle" class="mono small" fill="#7797bb">THE FUTURE IS UNDER CONSTRUCTION.</text>
<path d="M420 955H780" stroke="url(#cyan)" stroke-width="2" filter="url(#glow)"/>
</svg>